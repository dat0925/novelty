<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ノベルティカード ジェネレーター | iFLAG</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    :root{--bg:#f4f5f7;--sf:#fff;--sf2:#f0f1f4;--bd:#dde0e8;--ac:#5b4ef0;--acl:#ede9ff;--ac2:#b86e00;--tx:#1a1a2e;--tx2:#6b7080;--gr:#1a8a3a;--rd:#dc2626;}
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Noto Sans JP',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;}
    #pwScreen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:999;}
    .pwbox{background:var(--sf);border-radius:16px;padding:40px 48px;box-shadow:0 4px 24px rgba(0,0,0,.1);text-align:center;width:320px;}
    .pwlogo{font-size:36px;margin-bottom:8px;}
    .pwtitle{font-size:14px;color:var(--tx2);margin-bottom:24px;}
    #pwIn{width:100%;padding:12px 16px;border:2px solid var(--bd);border-radius:10px;font-size:22px;text-align:center;letter-spacing:.4em;color:var(--tx);outline:none;font-family:monospace;}
    #pwIn:focus{border-color:var(--ac);}
    #pwErr{color:var(--rd);font-size:12px;margin-top:6px;min-height:18px;}
    #pwBtn{width:100%;padding:12px;margin-top:12px;background:var(--ac);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;font-family:'Noto Sans JP',sans-serif;}
    #pwBtn:hover{opacity:.85;}
    header{padding:14px 36px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:12px;background:var(--sf);box-shadow:0 1px 4px rgba(0,0,0,.05);}
    .hlogo{width:30px;height:30px;background:var(--ac);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#fff;}
    header h1{font-size:16px;font-weight:600;}
    .hsub{font-size:12px;color:var(--tx2);}
    .app{display:grid;grid-template-columns:420px 1fr;min-height:calc(100vh - 53px);}
    .panel{background:var(--sf);border-right:1px solid var(--bd);overflow-y:auto;padding:20px 22px 40px;}
    .sec{margin-bottom:22px;padding-bottom:22px;border-bottom:1px solid var(--bd);}
    .sec:last-child{border-bottom:none;}
    .seclbl{font-size:10px;letter-spacing:.1em;color:var(--ac);font-weight:700;text-transform:uppercase;margin-bottom:12px;display:flex;align-items:center;gap:7px;}
    .seclbl::before{content:'';width:12px;height:2px;background:var(--ac);border-radius:2px;}
    .acchdr{display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none;}
    .accarr{font-size:11px;color:var(--tx2);transition:transform .2s;}
    .acchdr.open .accarr{transform:rotate(180deg);}
    .accbody{max-height:0;overflow:hidden;transition:max-height .3s ease;}
    .accbody.open{max-height:160px;}
    label{display:block;font-size:12px;color:var(--tx2);margin-bottom:5px;margin-top:13px;}
    label:first-child{margin-top:0;}
    input[type=text],input[type=password],textarea,select{width:100%;background:var(--sf2);border:1px solid var(--bd);border-radius:8px;padding:8px 11px;color:var(--tx);font-size:13px;font-family:'Noto Sans JP',sans-serif;transition:border-color .2s;}
    input:focus,textarea:focus,select:focus{outline:none;border-color:var(--ac);}
    select option{background:var(--sf);color:var(--tx);}
    textarea{resize:vertical;min-height:64px;}
    .apistat{font-size:11px;margin-top:4px;color:var(--tx2);}
    .apistat.ok{color:var(--gr);}
    .ziprow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end;}
    .btnzip{padding:8px 11px;border-radius:8px;border:1px solid var(--ac);background:var(--acl);color:var(--ac);font-size:12px;cursor:pointer;white-space:nowrap;font-family:'Noto Sans JP',sans-serif;transition:all .15s;}
    .btnzip:hover{background:var(--ac);color:#fff;}
    .chips{display:flex;flex-wrap:wrap;gap:5px;}
    .chip{padding:5px 12px;border-radius:20px;border:1px solid var(--bd);background:var(--sf2);font-size:12px;cursor:pointer;transition:all .15s;color:var(--tx2);white-space:nowrap;}
    .chip:hover{border-color:var(--ac);color:var(--ac);}
    .chip.on{background:var(--ac);border-color:var(--ac);color:#fff;}
    .catlbl{font-size:11px;color:var(--tx2);margin-bottom:6px;}
    .catrow{margin-bottom:10px;}
    .btngen{width:100%;padding:12px;border-radius:10px;border:none;background:var(--ac);color:#fff;font-size:14px;font-weight:700;font-family:'Noto Sans JP',sans-serif;cursor:pointer;transition:opacity .2s;margin-top:6px;}
    .btngen:hover{opacity:.85;}
    .btngen:disabled{opacity:.38;cursor:not-allowed;}
    .btnsub{width:100%;padding:9px;border-radius:10px;border:1px solid var(--bd);background:transparent;color:var(--tx2);font-size:13px;font-family:'Noto Sans JP',sans-serif;cursor:pointer;transition:border-color .2s;margin-top:7px;}
    .btnsub:hover{border-color:var(--ac);color:var(--ac);}
    .prev{display:flex;flex-direction:column;align-items:center;padding:28px;gap:18px;background:var(--bg);overflow-y:auto;}
    .prevhdr{width:100%;max-width:720px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;}
    .prevhdr h2{font-size:12px;color:var(--tx2);font-weight:400;}
    .expbtns{display:flex;gap:7px;}
    .btnexp{padding:7px 16px;border-radius:8px;border:1px solid var(--bd);background:var(--sf);color:var(--tx2);font-size:12px;font-family:'Noto Sans JP',sans-serif;cursor:pointer;transition:all .15s;}
    .btnexp:hover{border-color:var(--ac);color:var(--ac);}
    .btnexp.gold{border-color:var(--ac2);color:var(--ac2);}
    .btnexp.gold:hover{background:var(--ac2);color:#fff;}
    .btnexp:disabled{opacity:.32;cursor:not-allowed;}
    .vartabs{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;width:100%;max-width:720px;}
    .varbtn{padding:4px 15px;border-radius:20px;border:1px solid var(--bd);background:var(--sf);color:var(--tx2);font-size:12px;cursor:pointer;transition:all .15s;font-family:'Noto Sans JP',sans-serif;}
    .varbtn.on{border-color:var(--ac);color:var(--ac);background:var(--acl);}
    .cardwrap{display:flex;gap:28px;flex-wrap:wrap;justify-content:center;}
    .cardside{text-align:center;}
    .cardlbl{font-size:11px;color:var(--tx2);margin-bottom:7px;}
    .card{width:176px;height:291px;border-radius:3px;overflow:hidden;box-shadow:0 5px 20px rgba(0,0,0,.1);background:#fff;}
    .loading{position:fixed;inset:0;background:rgba(244,245,247,.9);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:300;gap:14px;}
    .loading.on{display:flex;}
    .spinner{width:34px;height:34px;border:3px solid var(--bd);border-top-color:var(--ac);border-radius:50%;animation:spin .8s linear infinite;}
    @keyframes spin{to{transform:rotate(360deg);}}
    .loadtxt{font-size:13px;color:var(--tx2);}
    .msg{padding:10px 13px;border-radius:8px;font-size:13px;margin-top:9px;line-height:1.5;}
    .msg.err{background:#fef2f2;color:var(--rd);border:1px solid #fecaca;}
    .msg.info{background:#eff6ff;color:#2563eb;border:1px solid #bfdbfe;}
    .promptbox{width:100%;max-width:720px;background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:13px;font-size:12px;color:var(--tx2);display:none;}
    .promptbox.on{display:block;}
    .promptbox pre{white-space:pre-wrap;word-break:break-all;max-height:200px;overflow-y:auto;margin-top:6px;line-height:1.6;}
    .empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:360px;gap:12px;color:var(--tx2);}
    .empty .ico{font-size:42px;opacity:.22;}
    .empty p{font-size:13px;}
    @media(max-width:820px){.app{grid-template-columns:1fr;}.panel{border-right:none;border-bottom:1px solid var(--bd);}}
  </style>
</head>
<body>

<div id="pwScreen">
  <div class="pwbox">
    <div class="pwlogo">🎴</div>
    <div class="pwtitle">iFLAG ノベルティカード ジェネレーター</div>
    <input type="password" id="pwIn" placeholder="●●●●" maxlength="10" autocomplete="off">
    <div id="pwErr"></div>
    <button id="pwBtn" onclick="checkPw()">ログイン</button>
  </div>
</div>

<div id="mainApp" style="display:none">
<header>
  <div class="hlogo">N</div>
  <h1>ノベルティカード ジェネレーター</h1>
  <span class="hsub">MEOサービス用 Googleクチコミ募集カード</span>
</header>

<div class="loading" id="loading">
  <div class="spinner"></div>
  <div class="loadtxt" id="loadtxt">生成中...</div>
</div>

<div class="app">
<div class="panel">

  <div class="sec">
    <div class="acchdr" id="acchdr" onclick="toggleAcc()">
      <div class="seclbl" style="margin-bottom:0">Claude API キー</div>
      <span class="accarr">▼</span>
    </div>
    <div class="accbody" id="accbody">
      <div style="padding-top:13px">
        <input type="password" id="apiKey" placeholder="sk-ant-api..." autocomplete="off">
        <div class="apistat" id="apistat">APIキーを入力してください</div>
      </div>
    </div>
  </div>

  <div class="sec">
    <div class="seclbl">業種</div>
    <div class="catrow">
      <div class="catlbl">大分類</div>
      <div class="chips" id="majChips"></div>
    </div>
    <div class="catrow" id="minRow" style="display:none">
      <div class="catlbl">中分類</div>
      <div class="chips" id="minChips"></div>
    </div>
    <div id="catFreeArea" style="display:none">
      <label>業種（自由記述）</label>
      <input type="text" id="catFree" placeholder="例：フラワーショップ、古着屋">
    </div>
  </div>

  <div class="sec">
    <div class="seclbl">店舗情報</div>
    <label>店舗名 <span style="color:var(--rd)">*</span></label>
    <input type="text" id="shopName" placeholder="例：Hair Salon Éclat">
    <label>キャッチコピー（任意）</label>
    <input type="text" id="catchcopy" placeholder="例：髪と心をリフレッシュ">
    <label>郵便番号</label>
    <div class="ziprow">
      <input type="text" id="zipCode" placeholder="例：5300001（ハイフン不要）" maxlength="8">
      <button class="btnzip" onclick="lookupZip()">住所検索</button>
    </div>
    <label>都道府県</label>
    <select id="pref">
      <option value="">選択</option>
      <option>北海道</option><option>青森県</option><option>岩手県</option><option>宮城県</option><option>秋田県</option><option>山形県</option><option>福島県</option><option>茨城県</option><option>栃木県</option><option>群馬県</option><option>埼玉県</option><option>千葉県</option><option>東京都</option><option>神奈川県</option><option>新潟県</option><option>富山県</option><option>石川県</option><option>福井県</option><option>山梨県</option><option>長野県</option><option>岐阜県</option><option>静岡県</option><option>愛知県</option><option>三重県</option><option>滋賀県</option><option>京都府</option><option>大阪府</option><option>兵庫県</option><option>奈良県</option><option>和歌山県</option><option>鳥取県</option><option>島根県</option><option>岡山県</option><option>広島県</option><option>山口県</option><option>徳島県</option><option>香川県</option><option>愛媛県</option><option>高知県</option><option>福岡県</option><option>佐賀県</option><option>長崎県</option><option>熊本県</option><option>大分県</option><option>宮崎県</option><option>鹿児島県</option><option>沖縄県</option>
    </select>
    <label>市区町村・番地</label>
    <input type="text" id="addr" placeholder="例：北区梅田1-2-3">
    <label>ビル名・フロア（任意）</label>
    <input type="text" id="addrSub" placeholder="例：〇〇ビル2F">
    <label>電話番号</label>
    <input type="text" id="tel" placeholder="例：06-1234-5678">
    <label>QRコード先URL（任意）</label>
    <input type="text" id="qrUrl" placeholder="例：https://g.page/r/...">
    <label>その他店舗情報（定休日・営業時間など）</label>
    <textarea id="shopNote" placeholder="定休日：火曜日&#10;営業時間：10:00〜20:00&#10;駐車場あり"></textarea>
  </div>

  <div class="sec">
    <div class="seclbl">デザイン設定</div>
    <label>雰囲気・テイスト</label>
    <div class="chips" id="styleChips">
      <div class="chip on" data-v="高級感・洗練">高級感</div>
      <div class="chip" data-v="ナチュラル・温かみ">ナチュラル</div>
      <div class="chip" data-v="ポップ・かわいい">ポップ</div>
      <div class="chip" data-v="シンプル・清潔感">シンプル</div>
      <div class="chip" data-v="和風・モダン">和風</div>
      <div class="chip" data-v="プロフェッショナル・信頼感">プロ・信頼</div>
    </div>
    <label>メインカラー</label>
    <div class="chips" id="colorChips">
      <div class="chip on" data-v="ゴールド×ダークグリーン">ゴールド×DK緑</div>
      <div class="chip" data-v="ネイビー×シルバー">ネイビー×銀</div>
      <div class="chip" data-v="テラコッタ×ベージュ">テラコッタ</div>
      <div class="chip" data-v="ブラック×ピンクゴールド">黒×ピンク金</div>
      <div class="chip" data-v="ラベンダー×ライトグレー">ラベンダー</div>
      <div class="chip" data-v="ホワイト×ブルー">白×ブルー</div>
      <div class="chip" data-v="ブラウン×クリーム">ブラウン</div>
    </div>
    <label>バリエーション数</label>
    <div class="chips" id="varChips">
      <div class="chip" data-v="1">1種</div>
      <div class="chip on" data-v="3">3種</div>
      <div class="chip" data-v="6">6種</div>
    </div>
    <label>その他デザイン要望</label>
    <textarea id="designNote" placeholder="例：桜のモチーフ、英語表記も、QRを大きくして など"></textarea>
  </div>

  <button class="btngen" id="btnGen" onclick="generate()">✨ AIでデザイン生成</button>
  <button class="btnsub" onclick="togglePrompt()">プロンプト確認</button>
  <div id="errArea"></div>
</div>

<div class="prev">
  <div class="prevhdr">
    <h2>プレビュー（実寸比：55×91mm）</h2>
    <div class="expbtns">
      <button class="btnexp gold" id="btnPdf" onclick="exportPDF()" disabled>📄 PDF保存</button>
      <button class="btnexp" id="btnSvg" onclick="exportSVG()" disabled>🎨 .svg/.ai保存</button>
    </div>
  </div>
  <div class="vartabs" id="vartabs"></div>
  <div class="cardwrap" id="cardwrap">
    <div class="empty"><div class="ico">🎴</div><p>フォームを入力して「AIでデザイン生成」を押してください</p></div>
  </div>
  <div class="promptbox" id="promptbox">
    <strong style="color:var(--tx)">プロンプト / デバッグ情報</strong>
    <pre id="prompttxt"></pre>
  </div>
</div>
</div>
</div>

<script>
if(sessionStorage.getItem('nv_auth')==='1')unlock();
document.getElementById('pwIn').addEventListener('keydown',e=>{if(e.key==='Enter')checkPw();});
function checkPw(){
  if(document.getElementById('pwIn').value==='2759'){sessionStorage.setItem('nv_auth','1');unlock();}
  else{document.getElementById('pwErr').textContent='パスワードが違います';document.getElementById('pwIn').value='';}
}
function unlock(){document.getElementById('pwScreen').style.display='none';document.getElementById('mainApp').style.display='block';}

let accOpen=false;
function toggleAcc(){
  accOpen=!accOpen;
  document.getElementById('acchdr').classList.toggle('open',accOpen);
  document.getElementById('accbody').classList.toggle('open',accOpen);
}

document.getElementById('apiKey').addEventListener('input',e=>{
  const v=e.target.value.trim(),s=document.getElementById('apistat');
  if(v.startsWith('sk-ant-')){s.textContent='✓ 形式OK';s.className='apistat ok';}
  else if(v){s.textContent='⚠ 形式を確認';s.className='apistat';}
  else{s.textContent='APIキーを入力してください';s.className='apistat';}
  sessionStorage.setItem('nv_key',v);
});
const sk=sessionStorage.getItem('nv_key');
if(sk){document.getElementById('apiKey').value=sk;document.getElementById('apiKey').dispatchEvent(new Event('input'));}

const CATS={
  '美容・ヘルスケア':['美容室・ヘアサロン','ネイルサロン','エステ・フェイシャル','リラクゼーション・マッサージ','整骨院・整体','鍼灸院','パーソナルトレーニング','ヨガ・ピラティス','歯科医院','その他（自由記述）'],
  '飲食':['和食（寿司・懐石・定食など）','イタリアン・フレンチ','中華・アジア料理','焼肉・ステーキ・鉄板','ラーメン・そば・うどん','カフェ・喫茶店','スイーツ・ケーキ・ベーカリー','居酒屋・ダイニングバー','テイクアウト・デリバリー','その他（自由記述）'],
  '小売・ショップ':['アパレル・ファッション','セレクトショップ・雑貨','食品・食料品','花屋・フラワーショップ','インテリア・家具','眼鏡・コンタクト','ペットショップ','書店・文具','その他（自由記述）'],
  '教育・習い事':['学習塾・進学塾','英会話スクール','そろばん教室','ピアノ・音楽教室','プログラミング教室','習字・書道教室','絵画・アート教室','スポーツスクール・武道','その他（自由記述）'],
  '住まい・暮らし':['工務店・リフォーム・建設','不動産・賃貸','クリーニング・ランドリー','ハウスクリーニング','庭師・造園','電気工事・水道・設備','引越し・物流','その他（自由記述）'],
  '専門サービス':['税理士・会計士・行政書士','弁護士・司法書士','保険・FP','写真スタジオ','印刷・デザイン','IT・WEB制作','コンサルティング','その他（自由記述）'],
  'その他':['その他（自由記述）']
};
let selMaj='',selMin='';
(function(){
  const el=document.getElementById('majChips');
  Object.keys(CATS).forEach(maj=>{
    const c=document.createElement('div');c.className='chip';c.textContent=maj;
    c.onclick=()=>pickMaj(maj,c);el.appendChild(c);
  });
})();
function pickMaj(maj,chipEl){
  document.querySelectorAll('#majChips .chip').forEach(c=>c.classList.remove('on'));
  chipEl.classList.add('on');selMaj=maj;selMin='';
  const minEl=document.getElementById('minChips');minEl.innerHTML='';
  CATS[maj].forEach(sub=>{
    const c=document.createElement('div');c.className='chip';c.textContent=sub.replace('（自由記述）','');
    c.onclick=()=>pickMin(sub,c);minEl.appendChild(c);
  });
  document.getElementById('minRow').style.display='block';
  document.getElementById('catFreeArea').style.display='none';
}
function pickMin(sub,chipEl){
  document.querySelectorAll('#minChips .chip').forEach(c=>c.classList.remove('on'));
  chipEl.classList.add('on');selMin=sub;
  document.getElementById('catFreeArea').style.display=sub.includes('自由記述')?'block':'none';
}
function getCat(){
  if(selMin&&selMin.includes('自由記述')){const f=document.getElementById('catFree').value.trim();return f||(selMaj||'（未選択）');}
  if(selMin)return selMaj+' > '+selMin;
  return selMaj||'（未選択）';
}

['styleChips','colorChips','varChips'].forEach(id=>{
  document.getElementById(id).addEventListener('click',e=>{
    const c=e.target.closest('.chip');if(!c)return;
    document.querySelectorAll('#'+id+' .chip').forEach(x=>x.classList.remove('on'));c.classList.add('on');
  });
});
function gc(id){const e=document.querySelector('#'+id+' .chip.on');return e?e.dataset.v:'';}

async function lookupZip(){
  let z=document.getElementById('zipCode').value.replace(/[^\d]/g,'');
  if(z.length!==7){alert('郵便番号は7桁で入力してください');return;}
  try{
    const r=await fetch('https://zipcloud.ibsnet.co.jp/api/search?zipcode='+z);
    const d=await r.json();
    if(d.results&&d.results.length){
      const a=d.results[0];
      const sel=document.getElementById('pref');
      for(let o of sel.options){if(o.text===a.address1){sel.value=o.text;break;}}
      document.getElementById('addr').value=a.address2+a.address3;
    }else{alert('住所が見つかりませんでした');}
  }catch(e){alert('住所検索エラー: '+e.message);}
}

function getAddr(){return[document.getElementById('pref').value,document.getElementById('addr').value,document.getElementById('addrSub').value].filter(Boolean).join(' ');}

function buildPrompt(){
  const d={cat:getCat(),shop:document.getElementById('shopName').value.trim(),
    catch:document.getElementById('catchcopy').value,addr:getAddr(),
    tel:document.getElementById('tel').value,qr:document.getElementById('qrUrl').value,
    note:document.getElementById('shopNote').value,style:gc('styleChips'),color:gc('colorChips'),
    vars:parseInt(gc('varChips'))||3,design:document.getElementById('designNote').value};
  return `あなたはプロのグラフィックデザイナーです。
店舗向けの「Googleクチコミ募集ショップカード」のHTMLデザインを${d.vars}パターン生成してください。

【カード仕様】名刺縦型 55mm×91mm 表・裏セット

【店舗情報】
業種: ${d.cat}
店舗名: ${d.shop}
${d.catch?'キャッチコピー: '+d.catch:''}
${d.addr?'住所: '+d.addr:''}
${d.tel?'電話: '+d.tel:''}
${d.qr?'QRコード先URL: '+d.qr:''}
${d.note?'その他情報:\n'+d.note:''}

【デザイン】テイスト: ${d.style} / カラー: ${d.color}
${d.design?'要望: '+d.design:''}

【出力ルール - 必ず守ること】
1. JSON形式のみ出力、最初の文字は { 、説明文や前置き一切不要
2. HTML属性は必ずダブルクォート: style="..." (シングルクォート禁止)
3. JSON内のダブルクォートは \\" にエスケープ
4. classやstyleブロック禁止、インラインstyleのみ

出力形式:
{"variations":[{"name":"パターン名","frontHtml":"<div style=\\"width:176px;height:291px\\">...</div>","backHtml":"<div style=\\"width:176px;height:291px\\">...</div>"}]}

【表面必須要素】
- 「クチコミ大募集」など訴求文（目立つサイズで）
- 以下のQRコードSVGをそのまま含める
- 店舗名
- 業種・テイストに合ったデザイン装飾（背景グラデーション・SVG装飾など）

QRコード用SVG（このまま使うこと）:
<svg width="80" height="80" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg"><rect width="80" height="80" fill="white"/><rect x="5" y="5" width="30" height="30" rx="2" fill="black"/><rect x="10" y="10" width="20" height="20" fill="white"/><rect x="13" y="13" width="14" height="14" fill="black"/><rect x="45" y="5" width="30" height="30" rx="2" fill="black"/><rect x="50" y="10" width="20" height="20" fill="white"/><rect x="53" y="13" width="14" height="14" fill="black"/><rect x="5" y="45" width="30" height="30" rx="2" fill="black"/><rect x="10" y="50" width="20" height="20" fill="white"/><rect x="13" y="53" width="14" height="14" fill="black"/><rect x="45" y="45" width="8" height="8" fill="black"/><rect x="55" y="45" width="8" height="8" fill="black"/><rect x="65" y="45" width="8" height="8" fill="black"/><rect x="45" y="55" width="8" height="8" fill="black"/><rect x="65" y="55" width="8" height="8" fill="black"/><rect x="45" y="65" width="8" height="8" fill="black"/><rect x="55" y="65" width="8" height="8" fill="black"/><rect x="65" y="65" width="8" height="8" fill="black"/></svg>

【裏面必須要素】店舗名（大）・キャッチコピー・住所・電話・感謝文・統一感ある装飾
【品質】システムフォントのみ（Hiragino Mincho ProN, Yu Mincho, serif, sans-serif）、各パターンは明確に異なるデザイン方向性`;
}

let vars=[],varIdx=0;

async function generate(){
  const key=document.getElementById('apiKey').value.trim();
  if(!key){if(!accOpen)toggleAcc();showErr('APIキーを入力してください');return;}
  const shop=document.getElementById('shopName').value.trim();
  if(!shop){showErr('店舗名を入力してください');return;}
  const prompt=buildPrompt();
  setLoad(true,'AIがデザインを生成中... (30〜60秒)');
  document.getElementById('btnGen').disabled=true;clearErr();
  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-opus-4-5',max_tokens:8000,messages:[{role:'user',content:prompt}]})
    });
    if(!res.ok){const e=await res.json().catch(()=>({}));throw new Error(e.error?.message||'API error '+res.status);}
    const result=await res.json();
    const text=result.content.map(b=>b.text||'').join('');
    const parsed=parseJson(text);
    vars=parsed.variations||[];
    if(!vars.length)throw new Error('バリエーションが空でした');
    renderTabs();renderCard(0);
    document.getElementById('btnPdf').disabled=false;
    document.getElementById('btnSvg').disabled=false;
  }catch(e){showErr('エラー: '+e.message);}
  finally{setLoad(false);document.getElementById('btnGen').disabled=false;}
}

function parseJson(text){
  const tries=[
    ()=>{const m=text.match(/```json\s*([\s\S]*?)```/);if(m)return JSON.parse(m[1]);},
    ()=>{const m=text.match(/```\s*([\s\S]*?)```/s);if(m)return JSON.parse(m[1]);},
    ()=>{const s=text.indexOf('{'),e=text.lastIndexOf('}');if(s>-1&&e>-1)return JSON.parse(text.slice(s,e+1));}
  ];
  for(const t of tries){try{const r=t();if(r)return r;}catch(e){}}
  document.getElementById('prompttxt').textContent='=== 生レスポンス ===\n\n'+text;
  document.getElementById('promptbox').classList.add('on');
  throw new Error('JSONパース失敗。「プロンプト確認」欄に生レスポンスを表示しました。もう一度お試しください。');
}

function renderTabs(){
  const el=document.getElementById('vartabs');el.innerHTML='';
  vars.forEach((v,i)=>{
    const b=document.createElement('button');b.className='varbtn'+(i===0?' on':'');
    b.textContent=v.name||'パターン'+(i+1);
    b.onclick=()=>{document.querySelectorAll('.varbtn').forEach(x=>x.classList.remove('on'));b.classList.add('on');renderCard(i);};
    el.appendChild(b);
  });
}
function renderCard(i){
  varIdx=i;const v=vars[i];if(!v)return;
  document.getElementById('cardwrap').innerHTML=
    `<div class="cardside"><div class="cardlbl">表面</div><div class="card">${v.frontHtml||''}</div></div>`+
    `<div class="cardside"><div class="cardlbl">裏面</div><div class="card">${v.backHtml||''}</div></div>`;
}

async function exportPDF(){
  if(!vars.length)return;
  setLoad(true,'PDFを生成中...');
  try{
    if(!window.html2canvas)await loadSc('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
    const{jsPDF}=window.jspdf;
    const pdf=new jsPDF({unit:'mm',format:'a4',orientation:'landscape'});
    const cw=55,ch=91,mx=10,my=15,gap=5;
    let cx=mx,cy=my,first=true;
    for(let vi=0;vi<vars.length;vi++){
      const v=vars[vi];
      for(const[lbl,html]of[['表面',v.frontHtml],['裏面',v.backHtml]]){
        if(cx+cw>297-mx){cx=mx;cy+=ch+gap+10;}
        if(!first&&cy+ch>210-my){pdf.addPage();cx=mx;cy=my;}
        first=false;
        const d=mkDiv(html);document.body.appendChild(d);
        try{
          const cv=await html2canvas(d,{scale:3,useCORS:true,logging:false});
          pdf.addImage(cv.toDataURL('image/jpeg',.95),'JPEG',cx,cy,cw,ch);
          pdf.setFontSize(5);pdf.setTextColor(150);
          pdf.text(`${v.name||'P'+(vi+1)} ${lbl}`,cx+1,cy+ch+3.5);
        }finally{document.body.removeChild(d);}
        cx+=cw+gap;
      }
    }
    pdf.save(`novelty_${document.getElementById('shopName').value||'card'}.pdf`);
  }catch(e){showErr('PDF生成エラー: '+e.message);}
  finally{setLoad(false);}
}

async function exportSVG(){
  if(!vars.length)return;
  setLoad(true,'SVGを生成中（印刷品質 300dpi相当）...');
  try{
    if(!window.html2canvas)await loadSc('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
    const shop=document.getElementById('shopName').value||'novelty';
    const A4W=3508,A4H=2480,cw=650,ch=1075,mx=120,my=200,gap=60,lh=50;
    const parts=[`<?xml version="1.0" encoding="UTF-8"?><svg width="${A4W}" height="${A4H}" viewBox="0 0 ${A4W} ${A4H}" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"><rect width="${A4W}" height="${A4H}" fill="#f6f6f6"/><text x="80" y="110" font-family="sans-serif" font-size="60" fill="#333" font-weight="bold">ノベルティカード - ${ex(shop)}</text>`];
    let cx=mx,cy=my+lh;
    for(let vi=0;vi<vars.length;vi++){
      const v=vars[vi];
      for(const[lbl,html]of[['表面',v.frontHtml],['裏面',v.backHtml]]){
        if(cx+cw>A4W-mx){cx=mx;cy+=ch+gap+lh;}
        const d=mkDiv(html);document.body.appendChild(d);
        try{
          const cv=await html2canvas(d,{scale:4,useCORS:true,logging:false});
          parts.push(`<text x="${cx}" y="${cy-14}" font-family="sans-serif" font-size="38" fill="#555">${ex(v.name||'P'+(vi+1))} ${lbl}</text>`);
          parts.push(`<image x="${cx}" y="${cy}" width="${cw}" height="${ch}" xlink:href="${cv.toDataURL('image/png')}"/>`);
          parts.push(`<rect x="${cx}" y="${cy}" width="${cw}" height="${ch}" fill="none" stroke="#bbb" stroke-width="2" stroke-dasharray="12,6"/>`);
        }finally{document.body.removeChild(d);}
        cx+=cw+gap;
      }
    }
    parts.push('</svg>');
    const blob=new Blob([parts.join('')],{type:'image/svg+xml'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download=`novelty_${shop}.svg`;a.click();URL.revokeObjectURL(url);
    document.getElementById('errArea').innerHTML='<div class="msg info">💡 .svgで保存しました。Adobe Illustratorで開き「別名で保存→.ai」で入稿用データに変換できます。入稿前にフォントのアウトライン化をお忘れなく。</div>';
  }catch(e){showErr('SVG生成エラー: '+e.message);}
  finally{setLoad(false);}
}

function ex(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function mkDiv(html){const d=document.createElement('div');d.style.cssText='position:fixed;left:-9999px;top:0;width:176px;height:291px;overflow:hidden;background:#fff;';d.innerHTML=html;return d;}
function loadSc(src){return new Promise((r,j)=>{const s=document.createElement('script');s.src=src;s.onload=r;s.onerror=j;document.head.appendChild(s);});}
function setLoad(on,txt=''){document.getElementById('loading').classList.toggle('on',on);if(txt)document.getElementById('loadtxt').textContent=txt;}
function showErr(m){document.getElementById('errArea').innerHTML=m?`<div class="msg err">${m}</div>`:'';}
function clearErr(){document.getElementById('errArea').innerHTML='';}
let promptOn=false;
function togglePrompt(){
  promptOn=!promptOn;
  if(promptOn)document.getElementById('prompttxt').textContent=buildPrompt();
  document.getElementById('promptbox').classList.toggle('on',promptOn);
}
</script>
